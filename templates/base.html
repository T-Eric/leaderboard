<!DOCTYPE html>
<html lang="zh">

    <head>
        <meta charset="UTF-8">
        <title id="title">网站标题</title>
        <link rel="favicon" href="{{url_for('static', filename='favicon.ico')}}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" type="text/css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        {%block head%}{%endblock%}

    <body class="theme-auto" id="body">
        {%for message in get_flashed_messages()%}
        <div class="alert">{{message}}</div>
        {%endfor%}
        <!-- 侧边栏及主要布局 -->
        <div id="app-container">
            <aside class="sidebar collapsed">
                <div class="sidebar-inner">
                    <ul class="nav-list nav-list-top">
                        <li class="nav-item">
                            <button id="sidebar-toggle" class="theme-button">
                                <i class="fas fa-bars nav-icon"></i>
                                <span class="nav-text">Navigation</span>
                            </button>
                        </li>
                        <li class="nav-item">
                            <a href="{{url_for('index')}}">
                                <i class="fas fa-home nav-icon"></i>
                                <span class="nav-text">首页</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="{{url_for('submit')}}">
                                <i class="fas fa-tachometer-alt nav-icon"></i>
                                <span class="nav-text">提交</span>
                            </a>
                        </li>
                    </ul>

                    <ul class="nav-list nav-list-bottom">
                        {# <li class="nav-item">
                            <a href="{{url_for('settings')}}">
                                <i class="fas fa-cog nav-icon"></i>
                                <span class="nav-text">设置</span>
                            </a>
                        </li> #}
                        <li class="nav-item">
                            <button id="theme-toggle-button" class="theme-button">
                                <i class="fas fa-adjust nav-icon"></i>
                                <span class="nav-text">切换样式</span>
                            </button>
                        </li>
                        {# if current_user.is_authenticated #}
                        {# <li class="nav-item">
                            <a href="{{url_for('logout')}}'">
                                <i class="fas fa-user-circle nav-icon"></i> <!--应当是用户头像-->
                                <span class="nav-text">登录</span>
                            </a>
                        </li> #}
                    </ul>
                </div>
            </aside>

            <div class="main-content">
                <main class="page-content">
                    {%block content%}{%endblock%}
                </main>
                <footer class="footer">
                    <small>
                        &copy; 2025 CS2916
                        <a href="https://acm.sjtu.edu.cn/OnlineJudge/">ACMOJ</a>|<a href="https://ji-z.net/">Stargazer's
                            Blog</a>
                    </small>
                </footer>
            </div>
        </div>
        <!-- 悬浮操作按钮（右下或右侧） -->
        <div id="ifloat-buttons">
            <button id="btn-top" title="回到顶部">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <path d="M14 22V6M14 6l-7 7M14 6l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
            <!-- 其它悬浮按钮可后续添加 -->
        </div>
    </body>

    <script src="static/js/base.js"></script>

</html>
