<!DOCTYPE html>
<html lang="zh">

    <head>
        <meta charset="UTF-8">
        <title id="title">OJBench LeaderBoard</title>
        <link rel="favicon" href="{{url_for('static', filename='favicon.ico')}}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" type="text/css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        {%block head%}{%endblock%}

    <body class="theme-auto" id="body">
        {%for message in get_flashed_messages()%}
        <div class="alert">{{message}}</div>
        {%endfor%}
        <!-- 侧边栏及主要布局 -->
        <div id="app-container">
            <aside class="sidebar collapsed">
                <div class="sidebar-inner">
                    <ul class="nav-list nav-list-top">
                        <li class="nav-item">
                            <button id="sidebar-toggle" class="theme-button">
                                <i class="fas fa-bars nav-icon"></i>
                                <span class="nav-text">Navigation</span>
                            </button>
                        </li>
                        <li class="nav-item">
                            <a href="{{url_for('index')}}">
                                <i class="fas fa-home nav-icon"></i>
                                <span class="nav-text">Home</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="{{url_for('submit')}}">
                                <i class="fas fa-tachometer-alt nav-icon"></i>
                                <span class="nav-text">Submit</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="{{url_for('add_model')}}">
                                <i class="fas fa-plus-circle nav-icon"></i>
                                <span class="nav-text">Add Model</span>
                            </a>
                        </li>
                    </ul>

                    <ul class="nav-list nav-list-bottom">
                        <li class="nav-item">
                            <a href="https://github.com/XsystemH/ACM-Benchmark" target="_blank"
                                rel="noopener noreferrer" aria-label="访问我们的 Git 仓库">
                                <i class="fab fa-github nav-icon"></i> <!-- 使用 Font Awesome 的 Git 图标 -->
                                <span class="nav-text">Git Repo</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <button id="theme-toggle-button" class="theme-button">
                                <i class="fas fa-adjust nav-icon"></i>
                                <span class="nav-text">Switch Theme</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </aside>

            <div class="main-content">
                <main class="page-content">
                    {%block content%}{%endblock%}
                </main>
                <footer class="footer">
                    <small>
                        &copy; 2025 CS2916
                        <a href="https://acm.sjtu.edu.cn/OnlineJudge/">ACMOJ</a> | <a
                            href="https://ji-z.net/">Stargazer's
                            Blog</a>
                    </small>
                </footer>
            </div>
        </div>
        <!-- 悬浮操作按钮（右下或右侧） -->
        <div id="float-buttons">
            <button id="btn-top" title="回到顶部">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <path d="M14 22V6M14 6l-7 7M14 6l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
        </div>
    </body>

    <script src="static/js/base.js"></script>
    {% block extra_js %}{% endblock %}

</html>
