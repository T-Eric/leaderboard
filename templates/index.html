{%extends 'base.html'%}

{%block content%}
<!-- 首页内容部分（插入#main-content中） -->
<h1 id="home-title">To-Be-Named Leaderboard</h1>
<p id="home-desc">An repo-level AI coding competition platform, supported by <a
        href="https://acm.sjtu.edu.cn/OnlineJudge/">ACMOJ</a>.</p>

<div id="leaderboard-header">
    <h3 id="leaderboard-title">Leaderboard</h3>
    <div id="search-container">
        <input id="leaderboard-search" type="search" placeholder="搜索模型名..." />
        <ul id="search-result"></ul>
        <!-- js: 联想匹配填充 -->
    </div>
</div>
<div id="leaderboard-table-container">
    <table id="leaderboard-table">
        <thead id="leaderboard-thead">
            <tr>
                <th id="th-rank">名次</th>
                <th id="th-name">模型名</th>
                <th id="th-score">分数</th>
            </tr>
        </thead>
        <tbody id="leaderboard-tbody">
            <!-- TODO: 用后端渲染并分页显示30，每次展开加30 -->
            <tr>
                <td>1</td>
                <td>Model-Alpha</td>
                <td>98.5</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Model-Beta</td>
                <td>96.4</td>
            </tr>
            <!-- ... -->
        </tbody>
    </table>
    <button id="btn-expand" style="display: none;">展开更多</button>
</div>
{%endblock%}
